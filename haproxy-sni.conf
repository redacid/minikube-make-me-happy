global
    daemon
    log stdout local0 info
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy

defaults
    mode tcp
    log global
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    option tcplog

# Kubernetes API Frontend (ваша існуюча конфігурація)
frontend k8s-api
    bind *:6443
    mode tcp
    default_backend k8s-masters

# Kubernetes API Backend (ваша існуюча конфігурація)
backend k8s-masters
    mode tcp
    balance roundrobin
    option tcp-check
    server minikube-master 192.168.49.2:8443 check

# HTTP Frontend (порт 80)
frontend web_http
    bind *:80
    mode tcp

    # TCP request inspection для отримання Host header
    tcp-request inspect-delay 5s
    tcp-request content accept if HTTP

    # ACL для визначення доменів nginx
    acl nginx_domains req.hdr(host) -i site1.example.com
    acl nginx_domains req.hdr(host) -i www.site1.example.com
    acl nginx_domains req.hdr(host) -i site2.example.com

    # Маршрутизація
    use_backend nginx_http if nginx_domains
    default_backend ingress_http

# HTTPS Frontend (порт 443) з SNI
frontend web_https
    bind *:443
    mode tcp

    # SNI inspection
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    # ACL для визначення доменів nginx на основі SNI
    acl nginx_domains req.ssl_sni -i site1.example.com
    acl nginx_domains req.ssl_sni -i www.site1.example.com
    acl nginx_domains req.ssl_sni -i site2.example.com

    # Маршрутизація
    use_backend nginx_https if nginx_domains
    default_backend ingress_https

# Backend для nginx HTTP
backend nginx_http
    mode tcp
    balance roundrobin
    server nginx1 127.0.0.1:8080 check

# Backend для nginx HTTPS
backend nginx_https
    mode tcp
    balance roundrobin
    server nginx1 127.0.0.1:8443 check

# Backend для ingress HTTP
backend ingress_http
    mode tcp
    balance roundrobin
    server ingress1 192.168.49.2:380 check

# Backend для ingress HTTPS
backend ingress_https
    mode tcp
    balance roundrobin
    server ingress1 192.168.49.2:3443 check

frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats realm Haproxy\ Statistics
    stats auth admin:YourSecurePassword
    stats refresh 10s
    stats admin if TRUE